services:
  web:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MIX_ENV: dev
  db:
    image: "postgres:16"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  deps:
  build:
  node_modules:
  pgdata:
